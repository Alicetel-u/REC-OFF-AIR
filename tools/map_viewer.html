const collisions=raw.split('\n').map(l=>{
  const p=l.split('|');
  return{name:p[1],x:+p[2],z:+p[3],w:+p[4],d:+p[5],rot:+p[6]};
});

const gamePoints=[
  {x:13.5,z:-23.5,label:'P',color:'#0f0',name:'START(13.5,-23.5)'},
  {x:-30,z:20,label:'A',color:'#ff0',name:'ItemA(-30,20)'},
  {x:70,z:-10,label:'B',color:'#ff0',name:'ItemB(70,-10)'},
  {x:61.25,z:3.5,label:'C',color:'#ff0',name:'ItemC(61,3.5)'},
  {x:8.75,z:80.25,label:'E',color:'#f80',name:'EXIT(8.75,80)'},
];

function drawRotatedRect(cx,cz,w,d,rot,color){
  const[sx,sy]=w2s(cx,cz);
  const scaleX=W/(MX1-MX0);
  const scaleZ=H/(MZ1-MZ0);
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(-rot);// canvas Y is flipped
  ctx.fillStyle=color;
  ctx.fillRect(-w/2*scaleX,-d/2*scaleZ,w*scaleX,d*scaleZ);
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=0.5;
  for(let x=MX0;x<=MX1;x+=10){
    const[sx]=w2s(x,0);
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
    if(x%20===0){ctx.fillStyle='#333';ctx.font='10px monospace';ctx.fillText(x,sx+2,H-4);}
  }
  for(let z=MZ0;z<=MZ1;z+=10){
    const[,sy]=w2s(0,z);
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
    if(z%20===0){ctx.fillStyle='#333';ctx.font='10px monospace';ctx.fillText('Z='+z,4,sy-2);}
  }

  // Collisions as rotated rectangles
  collisions.forEach(c=>{
    let color='rgba(180,40,40,0.7)';// default red
    if(c.name.startsWith('ManualBuilding'))color='rgba(200,50,50,0.85)';
    else if(c.name.startsWith('Tree'))color='rgba(30,120,30,0.5)';
    else if(c.name.startsWith('Manual_Car'))color='rgba(180,80,180,0.6)';
    else if(c.name.startsWith('Manual_Buddha'))color='rgba(180,80,180,0.6)';
    else if(c.name.startsWith('Shopping'))color='rgba(255,150,0,0.6)';
    else if(c.name.startsWith('Utility'))color='rgba(60,100,200,0.5)';
    drawRotatedRect(c.x,c.z,c.w,c.d,c.rot,color);
  });

  // Game points
  gamePoints.forEach(p=>{
    const[sx,sy]=w2s(p.x,p.z);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(sx,sy,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 11px monospace';
    ctx.fillText(p.label,sx-4,sy+4);
    ctx.fillStyle=p.color;ctx.font='11px monospace';
    ctx.fillText(p.name,sx+12,sy+4);
  });

  // Route
  ctx.strokeStyle='rgba(0,255,100,0.5)';ctx.lineWidth=2;ctx.setLineDash([8,4]);
  ctx.beginPath();
  const route=[[13.5,-23.5],[-30,20],[70,-10],[61.25,3.5],[8.75,80.25]];
  route.forEach(([x,z],i)=>{const[sx,sy]=w2s(x,z);if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);});
  ctx.stroke();ctx.setLineDash([]);
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const sx=(e.clientX-r.left)*(W/r.width),sy=(e.clientY-r.top)*(H/r.height);
  const[wx,wz]=s2w(sx,sy);
  coordsEl.textContent=`X=${wx.toFixed(1)}, Z=${wz.toFixed(1)}`;
});

draw();
</script>
