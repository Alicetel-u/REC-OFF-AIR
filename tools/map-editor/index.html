<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CP3 MAP Route Editor</title>
<style>
:root {
  --pv-bg: #080c1a;
  --pv-panel: linear-gradient(180deg, #0d1e42 0%, #090f28 50%, #0d1e42 100%);
  --pv-border: #131f3a;
  --pv-inner: rgba(130,160,210,0.3);
  --pv-accent: #d4a837;
  --pv-accent2: #f0d060;
  --pv-tx0: #eef0f5;
  --pv-tx1: #a8b4cc;
  --pv-tx2: #6b7a99;
  --pv-glow: rgba(80,120,200,0.12);
  --red: #ff6b6b; --yellow: #ffd93d; --green: #6bcb77; --blue: #4d96ff; --cyan: #3db8b8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--pv-bg);color:var(--pv-tx0);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{height:48px;background:var(--pv-panel);border-bottom:1px solid var(--pv-border);box-shadow:inset 0 -1px 0 var(--pv-inner);display:flex;align-items:center;padding:0 16px;gap:12px}
header h1{font-size:14px;letter-spacing:.12em;background:linear-gradient(135deg,var(--pv-accent) 0%,var(--pv-accent2) 50%,var(--pv-accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
.btn{padding:6px 10px;border:1px solid var(--pv-inner);border-radius:3px;background:rgba(0,0,0,.3);color:var(--pv-tx1);font-size:11px;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.btn:hover{background:rgba(130,160,210,.15);color:var(--pv-tx0);border-color:rgba(130,160,210,.5)}
.btn.active{background:rgba(212,168,55,.15);color:var(--pv-accent);border-color:var(--pv-accent)}
.btn.danger{border-color:rgba(196,60,60,.4);color:#ff6b6b}
.btn.danger:hover{background:rgba(196,60,60,.15);border-color:rgba(255,100,100,.5)}
#main{flex:1;display:grid;grid-template-columns:1fr 280px;grid-template-rows:1fr 160px;gap:0;overflow:hidden}
#map-wrap{grid-row:1;grid-column:1;position:relative;overflow:hidden;border-right:1px solid var(--pv-border);border-bottom:1px solid var(--pv-border)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#coords{position:absolute;bottom:10px;left:10px;font-size:11px;color:var(--pv-tx1);background:rgba(8,12,26,.85);border:1px solid var(--pv-inner);padding:5px 12px;border-radius:4px;font-family:'Consolas',monospace;backdrop-filter:blur(4px)}
#zoom-info{position:absolute;top:10px;right:10px;font-size:10px;background:rgba(8,12,26,.88);border:1px solid var(--pv-inner);padding:4px 10px;border-radius:4px;color:var(--pv-tx2);font-family:'Consolas',monospace;backdrop-filter:blur(4px)}
#right-panel{grid-row:1;grid-column:2;background:var(--pv-panel);border-bottom:1px solid var(--pv-border);box-shadow:inset 1px 0 0 var(--pv-inner);display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:10px;color:var(--pv-accent);padding:12px 12px 8px;border-bottom:1px solid var(--pv-border);box-shadow:inset 0 -1px 0 var(--pv-inner);letter-spacing:.15em;text-transform:uppercase}
#wp-list{flex:1;overflow-y:auto;padding:4px 6px}
#wp-list::-webkit-scrollbar{width:5px}
#wp-list::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
#wp-list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#1e3a6e,#2a4a80);border-radius:3px}
.wp-item{display:flex;align-items:center;gap:6px;padding:5px 10px;margin:2px 0;border-radius:3px;font-size:11px;font-family:'Consolas',monospace;cursor:pointer;border-left:3px solid transparent;transition:all .12s}
.wp-item:hover{background:rgba(130,160,210,.08)}
.wp-item.selected{background:linear-gradient(90deg,rgba(212,168,55,.2) 0%,rgba(212,168,55,.05) 100%);border-left-color:var(--pv-accent);box-shadow:inset 0 0 0 1px rgba(212,168,55,.15)}
.wp-item .num{color:var(--pv-accent);font-weight:600;min-width:20px;text-align:right;margin-right:4px}
.wp-item .pos{color:var(--pv-tx1);font-size:10px}
.wp-item .del{margin-left:auto;color:var(--pv-tx2);cursor:pointer;font-size:13px;padding:0 4px;transition:color .1s}
.wp-item .del:hover{color:var(--red)}
#wp-controls{padding:8px 12px;border-top:1px solid var(--pv-border);box-shadow:inset 0 1px 0 rgba(130,160,210,.07);display:flex;gap:4px;flex-wrap:wrap}
#bottom-panel{grid-row:2;grid-column:1/3;background:var(--pv-panel);border-top:1px solid var(--pv-border);box-shadow:inset 0 1px 0 var(--pv-inner);display:flex;flex-direction:column}
#json-header{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--pv-border);box-shadow:inset 0 -1px 0 rgba(130,160,210,.07)}
#json-header span{font-size:10px;color:var(--pv-accent);letter-spacing:.15em;text-transform:uppercase}
#json-out{flex:1;padding:8px 12px;font-family:'Consolas','SF Mono',monospace;font-size:11px;color:var(--green);overflow:auto;white-space:pre;background:rgba(0,0,0,.2)}
#json-out::-webkit-scrollbar{height:5px;width:5px}
#json-out::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
#json-out::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#1e3a6e,#2a4a80);border-radius:3px}
#route-select{display:flex;gap:4px;padding:6px 12px}
.route-tab{padding:4px 10px;border:1px solid var(--pv-border);border-radius:3px;font-size:10px;cursor:pointer;color:var(--pv-tx2);background:transparent;transition:all .15s;letter-spacing:.04em}
.route-tab:hover{color:var(--pv-tx0);background:rgba(130,160,210,.08);border-color:rgba(130,160,210,.3)}
.route-tab.active{color:var(--pv-accent);border-color:var(--pv-accent);background:rgba(212,168,55,.1);box-shadow:0 0 8px rgba(212,168,55,.15)}
</style>
</head>
<body>
<header>
  <h1>ME — CP3 MAP Editor</h1>
  <div style="flex:1"></div>
  <button class="btn" id="btn-mode-view" onclick="setEditMode('view')">閲覧</button>
  <button class="btn" id="btn-mode-road-add" onclick="setEditMode('road-add')">道路:追加</button>
  <button class="btn" id="btn-mode-road-connect" onclick="setEditMode('road-connect')">道路:接続</button>
  <button class="btn" id="btn-mode-road-delete" onclick="setEditMode('road-delete')">道路:削除</button>
  <button class="btn" id="btn-mode-route" onclick="setEditMode('route')">ルート編集</button>
  <button class="btn" id="btn-mode-points" onclick="setEditMode('points')">配置変更</button>
  <span style="color:var(--pv-tx2);font-size:10px;margin:0 4px">|</span>
  <button class="btn" onclick="fitMap()">全体表示</button>
  <button class="btn danger" onclick="clearAllWP()">全クリア</button>
  <div id="mode-label" style="font-size:11px;color:var(--pv-accent);margin-left:8px"></div>
</header>
<div id="main">
  <div id="map-wrap">
    <canvas id="c"></canvas>
    <div id="coords">X=0.0, Z=0.0</div>
    <div id="zoom-info">100%</div>
  </div>
  <div id="right-panel">
    <div class="panel-title">WAYPOINTS</div>
    <div id="route-select"></div>
    <div id="wp-list"></div>
    <div id="wp-controls">
      <button class="btn" onclick="undoWP()">Undo</button>
      <button class="btn danger" onclick="clearCurrentRoute()">現ルートクリア</button>
    </div>
  </div>
  <div id="bottom-panel">
    <div id="json-header">
      <span>JSON OUTPUT</span>
      <button class="btn" onclick="copyJSON()">Copy</button>
      <button class="btn" onclick="downloadJSON()">Download</button>
    </div>
    <div id="json-out"></div>
  </div>
</div>

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;draw();}
window.addEventListener('resize',resize);

function w2s(wx,wz){
  const cx=canvas.width/2,cy=canvas.height/2;
  return[(wx-cam.x)*cam.scale+cx,(wz-cam.z)*cam.scale+cy];
}
function s2w(sx,sy){
  const cx=canvas.width/2,cy=canvas.height/2;
  return[(sx-cx)/cam.scale+cam.x,(sy-cy)/cam.scale+cam.z];
}

function drawRotRect(cx,cz,w,d,rot,color){
  const[sx,sy]=w2s(cx,cz);
  const sw=w*cam.scale,sd=d*cam.scale;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(-rot);
  ctx.fillStyle=color;ctx.fillRect(-sw/2,-sd/2,sw,sd);
  ctx.restore();
}

function draw(){

  const gridStep=10;
  const[lx,tz]=s2w(0,0);const[rx,bz]=s2w(W,H);
  ctx.strokeStyle='#151520';ctx.lineWidth=1;
  ctx.font='10px Consolas';ctx.fillStyle='#333';
  for(let x=Math.floor(lx/gridStep)*gridStep;x<=rx;x+=gridStep){
    const[sx]=w2s(x,0);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
    if(x%20===0)ctx.fillText(x,sx+2,H-4);
  }
  for(let z=Math.floor(bz/gridStep)*gridStep;z<=tz;z+=gridStep){
    const[,sy]=w2s(0,z);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
    if(z%20===0)ctx.fillText('Z='+z,4,sy-2);
  }

  // ── コリジョン（4隅ポリゴン = ゲーム内と完全一致） ──
  quads.forEach(q=>{
    ctx.beginPath();
    q.forEach(([x,z],i)=>{const[sx,sy]=w2s(x,z);if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);});
    ctx.closePath();
    // サイズで色分け（大=建物茶色、中=壁グレー、小=電柱青）
    const dx=q[1][0]-q[0][0],dz=q[1][1]-q[0][1];
    const dx2=q[2][0]-q[1][0],dz2=q[2][1]-q[1][1];
    const w=Math.sqrt(dx*dx+dz*dz),h=Math.sqrt(dx2*dx2+dz2*dz2);
    const area=w*h;
    if(area>200) ctx.fillStyle='rgba(140,100,50,0.6)';      // 建物（大）
    else if(area>30) ctx.fillStyle='rgba(80,100,80,0.4)';    // 森/木（中）
    else ctx.fillStyle='rgba(120,130,140,0.55)';             // 壁（小）
    ctx.fill();
    ctx.strokeStyle='rgba(150,160,170,0.3)';ctx.lineWidth=0.5;ctx.stroke();
  });

  // ── 道路ノード + エッジ ──
  if(roadNodes.length>0){
    // エッジ（接続線）
    ctx.strokeStyle='rgba(100,200,255,0.5)';ctx.lineWidth=2;
    roadEdges.forEach(([a,b])=>{
      const na=roadNodes.find(n=>n.id===a),nb=roadNodes.find(n=>n.id===b);
      if(!na||!nb)return;
      const[ax,ay]=w2s(na.x,na.z),[bx,by]=w2s(nb.x,nb.z);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    });
    // ノード
    roadNodes.forEach(n=>{
      const[sx,sy]=w2s(n.x,n.z);
      const isSel=roadSelectedNode===n.id;
      ctx.fillStyle=isSel?'rgba(255,200,50,0.8)':'rgba(100,200,255,0.7)';
      ctx.beginPath();ctx.arc(sx,sy,isSel?7:5,0,Math.PI*2);ctx.fill();
      if(editMode==='road'){
        ctx.fillStyle='#fff';ctx.font='9px Consolas';
        ctx.fillText(n.id,sx+8,sy+3);
      }
    });
  }

  // ── クリックピン ──
  if(clickedPos&&editMode==='view'){
    const[px,py]=w2s(clickedPos.x,clickedPos.z);
    // ピン（十字 + 座標）
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px-10,py);ctx.lineTo(px+10,py);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py-10);ctx.lineTo(px,py+10);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='11px Consolas';
    ctx.fillText(`(${clickedPos.x}, ${clickedPos.z})`,px+14,py-4);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px "Segoe UI","Meiryo",sans-serif';
    ctx.fillText('右クリックでコピー',px+14,py+10);
  }

  // ── ゲームポイント ──
  GAME_POINTS.forEach(p=>{
    const[sx,sy]=w2s(p.x,p.z);
    if(p.id==='start'){
      // START = 青い円（イベントエディター風）
      ctx.fillStyle='rgba(77,150,255,0.3)';ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4d96ff';ctx.beginPath();ctx.arc(sx,sy,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 9px Consolas';ctx.fillText('S',sx-3,sy+3);
      ctx.fillStyle='#4d96ff';ctx.font='11px "Segoe UI","Meiryo",sans-serif';ctx.fillText('START',sx+12,sy+4);
    } else if(p.id==='exit'){
      // EXIT = 赤い四角（イベントエディター風）
      ctx.fillStyle='rgba(255,100,100,0.3)';ctx.fillRect(sx-10,sy-10,20,20);
      ctx.fillStyle='#ff6b6b';ctx.fillRect(sx-6,sy-6,12,12);
      ctx.fillStyle='#fff';ctx.font='bold 8px Consolas';ctx.fillText('G',sx-3,sy+3);
      ctx.fillStyle='#ff6b6b';ctx.font='11px "Segoe UI","Meiryo",sans-serif';ctx.fillText('GOAL',sx+12,sy+4);
    } else {
      // アイテム = 黄色い丸
      ctx.fillStyle='rgba(255,217,61,0.3)';ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';ctx.font='bold 9px Consolas';ctx.fillText(p.label,sx-3,sy+3);
      ctx.fillStyle='#ffd93d';ctx.font='11px "Segoe UI","Meiryo",sans-serif';ctx.fillText(p.name,sx+12,sy+4);
    }
  });

  // Routes（ルート編集モードの時だけ表示）
  if(editMode==='route') ROUTE_KEYS.forEach((key,ri)=>{
    const wps=routes[key];if(!wps.length)return;
    const startPt=ri===0?GAME_POINTS[0]:GAME_POINTS[ri]; // 前のアイテム or START
    const endPt=GAME_POINTS[ri+1]; // 目的地
    const isActive=key===currentRoute;
    const col=ROUTE_COLORS[ri];

    // 線
    ctx.strokeStyle=isActive?col:'rgba(255,255,255,0.15)';
    ctx.lineWidth=isActive?2.5:1;ctx.setLineDash(isActive?[]:[4,4]);
    ctx.beginPath();
    const[sx0,sy0]=w2s(startPt.x,startPt.z);ctx.moveTo(sx0,sy0);
    wps.forEach(wp=>{const[sx,sy]=w2s(wp[0],wp[1]);ctx.lineTo(sx,sy);});
    const[sxe,sye]=w2s(endPt.x,endPt.z);ctx.lineTo(sxe,sye);
    ctx.stroke();ctx.setLineDash([]);

    // WPマーカー
    wps.forEach((wp,i)=>{
      const[sx,sy]=w2s(wp[0],wp[1]);
      ctx.fillStyle=isActive?col:'rgba(255,255,255,0.3)';
      ctx.beginPath();ctx.arc(sx,sy,isActive?6:4,0,Math.PI*2);ctx.fill();
      if(isActive){
        ctx.fillStyle='#000';ctx.font='bold 9px Consolas';
        ctx.fillText(i+1,sx-3,sy+3);
      }
    });
  });

  document.getElementById('zoom-info').textContent=Math.round(cam.scale*100/4.5)+'%';
}

// Input

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const[wx,wz]=s2w(e.offsetX,e.offsetY);
  cam.scale*=e.deltaY<0?1.15:0.87;
  cam.scale=Math.max(0.5,Math.min(50,cam.scale));
  // ズーム中心をマウス位置に
  const[nx,nz]=s2w(e.offsetX,e.offsetY);
  cam.x-=nx-wx;cam.z-=nz-wz;
  draw();
},{passive:false});

canvas.addEventListener('mousedown',e=>{
  // 中ボタン or 右ボタン+Alt or スペース押しながら → パン
  if(e.button===1){isPanning=true;panStart={x:e.offsetX,y:e.offsetY};camStart={x:cam.x,z:cam.z};return;}
  // 閲覧モード: 左ドラッグでパン（ポイント以外）
  if(e.button===0&&editMode==='view'&&!e.shiftKey){
    const[wx,wz]=s2w(e.offsetX,e.offsetY);
    // ポイント上かチェック
    let hitPoint=false;
    for(let i=0;i<GAME_POINTS.length;i++){
      const p=GAME_POINTS[i];
      const dx=p.x-wx,dz=p.z-wz;
      if(Math.sqrt(dx*dx+dz*dz)<6/cam.scale*4.5){hitPoint=true;break;}
    }
    if(!hitPoint){isPanning=true;panStart={x:e.offsetX,y:e.offsetY};camStart={x:cam.x,z:cam.z};}
  }
  if(e.button===0){
    const[wx,wz]=s2w(e.offsetX,e.offsetY);
    if(editMode==='road-add'){
      // 追加モード: 既存ノードはドラッグ、空き地はノード追加
      for(let i=0;i<roadNodes.length;i++){
        const n=roadNodes[i];
        const dx=n.x-wx,dz=n.z-wz;
        if(Math.sqrt(dx*dx+dz*dz)<4/cam.scale*4.5){dragRoadIdx=i;return;}
      }
      roadNodes.push({id:roadNextId,x:Math.round(wx*10)/10,z:Math.round(wz*10)/10});
      roadNextId++;
      saveRoad();updateUI();draw();
      return;
    }
    if(editMode==='road-connect'){
      // 接続モード: ノードを2つクリックして接続
      for(let i=0;i<roadNodes.length;i++){
        const n=roadNodes[i];
        const dx=n.x-wx,dz=n.z-wz;
        if(Math.sqrt(dx*dx+dz*dz)<5/cam.scale*4.5){
          if(roadSelectedNode<0){
            roadSelectedNode=n.id;
          } else if(roadSelectedNode!==n.id){
            const edge=[Math.min(roadSelectedNode,n.id),Math.max(roadSelectedNode,n.id)];
            if(!roadEdges.some(e=>e[0]===edge[0]&&e[1]===edge[1])){
              roadEdges.push(edge);
            }
            roadSelectedNode=-1;
          }
          saveRoad();updateUI();draw();return;
        }
      }
      // 空き地クリック: 選択解除
      roadSelectedNode=-1;updateUI();draw();
      return;
    }
    if(editMode==='road-delete'){
      // 削除モード: ノードクリックで削除
      for(let i=roadNodes.length-1;i>=0;i--){
        const n=roadNodes[i];
        const dx=n.x-wx,dz=n.z-wz;
        if(Math.sqrt(dx*dx+dz*dz)<5/cam.scale*4.5){
          const delId=n.id;
          roadNodes.splice(i,1);
          roadEdges=roadEdges.filter(e=>e[0]!==delId&&e[1]!==delId);
          saveRoad();updateUI();draw();return;
        }
      }
      return;
    }
    if(editMode==='view'){
      // 閲覧モード: ポイント or 空き地をクリックで選択
      selectedPoint=null;
      for(let i=0;i<GAME_POINTS.length;i++){
        const p=GAME_POINTS[i];
        const dx=p.x-wx,dz=p.z-wz;
        if(Math.sqrt(dx*dx+dz*dz)<6/cam.scale*4.5){selectedPoint=p;break;}
      }
      // クリック位置にピンを立てる
      clickedPos={x:Math.round(wx*100)/100, z:Math.round(wz*100)/100};
      updateUI();draw();
      return;
    }
    if(editMode==='points'){
      for(let i=0;i<GAME_POINTS.length;i++){
        const p=GAME_POINTS[i];
        if(!p.id.startsWith('item_')&&!p.id.startsWith('ghost')) continue;
        const dx=p.x-wx,dz=p.z-wz;
        if(Math.sqrt(dx*dx+dz*dz)<5/cam.scale*4.5){dragPointIdx=i;return;}
      }
      return;
    }
    // ルート編集モード
    const wps=routes[currentRoute];
    for(let i=0;i<wps.length;i++){
      const dx=wps[i][0]-wx,dz=wps[i][1]-wz;
      if(Math.sqrt(dx*dx+dz*dz)<3/cam.scale*4.5){dragIdx=i;return;}
    }
    wps.push([Math.round(wx*10)/10,Math.round(wz*10)/10]);
    save();updateUI();draw();
  }
  if(e.button===2){
    e.preventDefault();
    const[wx,wz]=s2w(e.offsetX,e.offsetY);
    if(editMode.startsWith('road-')){
      // 道路モード全般: 右クリックは座標コピー
      const coordStr=`${wx.toFixed(2)}, ${wz.toFixed(2)}`;
      copyToClipboard(coordStr);
      document.getElementById('coords').textContent=`✓ Copied: (${coordStr})`;
      return;
    }
    if(editMode==='view'){
      // 右クリック: clickedPosがあればその座標をコピー、なければカーソル位置
      const cp=clickedPos||{x:wx,z:wz};
      const coordStr=`${cp.x.toFixed(2)}, ${cp.z.toFixed(2)}`;
      copyToClipboard(coordStr);
      document.getElementById('coords').textContent=`✓ Copied: (${coordStr})`;
      return;
    }
    if(editMode==='points'){
      const coordStr=`${wx.toFixed(2)}, ${wz.toFixed(2)}`;
      copyToClipboard(coordStr);
      document.getElementById('coords').textContent=`✓ Copied: (${coordStr})`;
      return;
    }
    const wps=routes[currentRoute];
    for(let i=wps.length-1;i>=0;i--){
      const dx=wps[i][0]-wx,dz=wps[i][1]-wz;
      if(Math.sqrt(dx*dx+dz*dz)<4/cam.scale*4.5){wps.splice(i,1);save();updateUI();draw();return;}
    }
    // ルート編集でもポイント外の右クリックは座標コピー
    const coordStr2=`${wx.toFixed(2)}, ${wz.toFixed(2)}`;
    copyToClipboard(coordStr2);
    document.getElementById('coords').textContent=`Copied: ${coordStr2}`;
  }
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

canvas.addEventListener('mousemove',e=>{
  if(isPanning){cam.x=camStart.x-(e.offsetX-panStart.x)/cam.scale;cam.z=camStart.z-(e.offsetY-panStart.y)/cam.scale;draw();return;}
  if(dragRoadIdx>=0){const[wx,wz]=s2w(e.offsetX,e.offsetY);roadNodes[dragRoadIdx].x=Math.round(wx*10)/10;roadNodes[dragRoadIdx].z=Math.round(wz*10)/10;saveRoad();updateUI();draw();return;}
  if(dragPointIdx>=0){const[wx,wz]=s2w(e.offsetX,e.offsetY);GAME_POINTS[dragPointIdx].x=Math.round(wx*100)/100;GAME_POINTS[dragPointIdx].z=Math.round(wz*100)/100;savePoints();updateUI();draw();return;}
  if(dragIdx>=0){const[wx,wz]=s2w(e.offsetX,e.offsetY);routes[currentRoute][dragIdx]=[Math.round(wx*10)/10,Math.round(wz*10)/10];save();updateUI();draw();return;}
  const[wx,wz]=s2w(e.offsetX,e.offsetY);
  document.getElementById('coords').textContent=`X=${wx.toFixed(1)}, Z=${wz.toFixed(1)}`;
});
canvas.addEventListener('mouseup',()=>{isPanning=false;dragIdx=-1;dragPointIdx=-1;dragRoadIdx=-1;});

// UI
// ═══════════════════════════════════════
function updateUI(){
  if(editMode==='view'){
    // 閲覧モード: ポイント一覧 + 選択情報
    document.getElementById('route-select').innerHTML='';
    let html='';
    GAME_POINTS.forEach(p=>{
      const sel=selectedPoint&&selectedPoint.id===p.id?'selected':'';
      html+=`<div class="wp-item ${sel}" onclick="selectedPoint=GAME_POINTS.find(pp=>pp.id==='${p.id}');updateUI();draw()"><span class="num" style="color:${p.color}">${p.label}</span><span class="pos">${p.name} (${p.x}, ${p.z})</span></div>`;
    });
    document.getElementById('wp-list').innerHTML=html;
  } else if(editMode.startsWith('road-')){
    // 道路ノードモード
    document.getElementById('route-select').innerHTML='';
    let html=`<div style="color:var(--pv-tx2);padding:8px 12px;font-size:11px">ノード: ${roadNodes.length} / エッジ: ${roadEdges.length}</div>`;
    roadNodes.forEach(n=>{
      const sel=roadSelectedNode===n.id?'selected':'';
      html+=`<div class="wp-item ${sel}"><span class="num" style="color:#64c8ff">${n.id}</span><span class="pos">(${n.x}, ${n.z})</span></div>`;
    });
    document.getElementById('wp-list').innerHTML=html||'「道路:追加」でノードを打つ';
  } else if(editMode==='route'){
    // ルート編集モード
    let tabsHtml='';
    ROUTE_KEYS.forEach((k,i)=>{
      const active=k===currentRoute?'active':'';
      const cnt=routes[k].length;
      tabsHtml+=`<div class="route-tab ${active}" onclick="selectRoute('${k}')">${ROUTE_LABELS[i]} (${cnt})</div>`;
    });
    document.getElementById('route-select').innerHTML=tabsHtml;
    const wps=routes[currentRoute];
    let html='';
    wps.forEach((wp,i)=>{
      html+=`<div class="wp-item" onclick="selectWP(${i})"><span class="num">${i+1}</span><span class="pos">(${wp[0]}, ${wp[1]})</span><span class="del" onclick="event.stopPropagation();deleteWP(${i})">×</span></div>`;
    });
    document.getElementById('wp-list').innerHTML=html||'<div style="color:#6b7a99;padding:12px;font-size:12px">マップをクリックしてWP追加</div>';
  } else {
    // 配置変更モード
    document.getElementById('route-select').innerHTML='';
    let html='';
    GAME_POINTS.forEach((p,i)=>{
      if(!p.id.startsWith('item_')&&!p.id.startsWith('ghost')) return;
      html+=`<div class="wp-item"><span class="num" style="color:${p.color}">${p.label}</span><span class="pos">${p.name} (${p.x}, ${p.z})</span></div>`;
    });
    document.getElementById('wp-list').innerHTML=html||'ドラッグで移動';
  }

  // JSON
  // JSON出力（ポイント + 道路グラフ + ルート）
  const points={};
  GAME_POINTS.forEach(p=>{points[p.id]={x:p.x,z:p.z};});
  const road_graph={road_nodes:roadNodes,road_edges:roadEdges};
  document.getElementById('json-out').textContent=JSON.stringify({points,road_graph,routes},null,2);
}

function selectRoute(key){currentRoute=key;updateUI();draw();}
function selectWP(i){/* future: highlight */}
function deleteWP(i){routes[currentRoute].splice(i,1);save();updateUI();draw();}
function undoWP(){const wps=routes[currentRoute];if(wps.length)wps.pop();save();updateUI();draw();}
function clearCurrentRoute(){routes[currentRoute]=[];save();updateUI();draw();}
function clearAllWP(){ROUTE_KEYS.forEach(k=>routes[k]=[]);save();updateUI();draw();}

function addPresetRoute(){
  // 一筆書き: START→A→B→C→EXIT （目的地は各ルートの最終点として自動追加される）
  routes={to_item_0:[],to_item_1:[],to_item_2:[],to_exit:[]};
  save();updateUI();draw();
  alert('各ルートタブを選択してマップ上でウェイポイントをクリックしてください。\n目的地（アイテム/出口）は自動的に経路の終点になります。');
}

function fitMap(){cam={x:20,z:20,scale:4.5};draw();}

function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  document.execCommand('copy');document.body.removeChild(ta);
}

function setEditMode(mode){
  editMode=mode;
  ['view','road-add','road-connect','road-delete','route','points'].forEach(m=>{
    const el=document.getElementById('btn-mode-'+m);
    if(el)el.classList.toggle('active',mode===m);
  });
  const labels={
    'view':'🔍 閲覧 — ドラッグで移動 / クリックで選択 / 右クリック座標コピー',
    'road-add':'➕ 道路:追加 — クリックでノード追加 / ドラッグで移動',
    'road-connect':'🔗 道路:接続 — ノードを2つクリックして接続',
    'road-delete':'❌ 道路:削除 — クリックでノード削除',
    'route':'📍 ルート編集 — クリックでWP追加',
    'points':'✋ 配置変更 — ドラッグで移動'
  };
  document.getElementById('mode-label').textContent=labels[mode]||'';
  canvas.style.cursor={
    'view':'default','road-add':'crosshair','road-connect':'pointer',
    'road-delete':'not-allowed','route':'crosshair','points':'grab'
  }[mode]||'default';
  roadSelectedNode=-1;
  updateUI();draw();
}

function saveRoad(){
  localStorage.setItem('cp3_road',JSON.stringify({nodes:roadNodes,edges:roadEdges,nextId:roadNextId}));
}
function loadRoad(){
  const s=localStorage.getItem('cp3_road');
  if(!s)return;
  try{const d=JSON.parse(s);roadNodes=d.nodes||[];roadEdges=d.edges||[];roadNextId=d.nextId||0;}catch(e){}
}

function savePoints(){
  const data={};
  GAME_POINTS.forEach(p=>{data[p.id]={x:p.x,z:p.z};});
  localStorage.setItem('cp3_points',JSON.stringify(data));
}
function loadPoints(){
  const s=localStorage.getItem('cp3_points');
  if(!s)return;
  try{
    const data=JSON.parse(s);
    GAME_POINTS.forEach(p=>{if(data[p.id]){p.x=data[p.id].x;p.z=data[p.id].z;}});
  }catch(e){}
}

function copyJSON(){
  const points={};GAME_POINTS.forEach(p=>{points[p.id]={x:p.x,z:p.z};});
  const road_graph={road_nodes:roadNodes,road_edges:roadEdges};
  const data={points,road_graph,routes};
  copyToClipboard(JSON.stringify(data,null,2));
  document.getElementById('json-header').querySelector('span').textContent='JSON OUTPUT — Copied!';
}
function downloadJSON(){
  const points={};GAME_POINTS.forEach(p=>{points[p.id]={x:p.x,z:p.z};});
  const road_graph={road_nodes:roadNodes,road_edges:roadEdges};
  const data={points,road_graph,routes};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cp3_routes.json';a.click();
}

// localStorage
function save(){localStorage.setItem('cp3_routes',JSON.stringify(routes));}
function load(){const s=localStorage.getItem('cp3_routes');if(s){try{routes=JSON.parse(s);}catch(e){}}}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoWP();}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();downloadJSON();}
  if(e.ctrlKey&&e.key==='c'&&!window.getSelection().toString()){e.preventDefault();copyJSON();}
  if(e.key==='1')selectRoute('to_item_0');
  if(e.key==='2')selectRoute('to_item_1');
  if(e.key==='3')selectRoute('to_item_2');
  if(e.key==='4')selectRoute('to_exit');
  if(e.key==='f'||e.key==='F')fitMap();
});

// Init
load();loadPoints();loadRoad();setEditMode('view');resize();updateUI();
</script>
</body>
</html>
