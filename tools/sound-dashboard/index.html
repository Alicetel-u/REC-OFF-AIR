<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REC-OFF-AIR シナリオ・エディタ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* エディタ用の追加スタイル */
        .timeline-container {
            flex: 2;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 12, 0.4);
        }

        .event-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .event-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            transition: 0.2s;
            position: relative;
        }

        .event-item:hover {
            border-color: var(--accent);
            background: var(--card-hover);
        }

        .event-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            background: var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            min-width: 60px;
            text-align: center;
        }

        .event-content {
            flex: 1;
            font-size: 0.9rem;
        }

        .event-say {
            border-left: 4px solid #4a90e2;
        }

        .event-sfx {
            border-left: 4px solid #e2a04a;
        }

        .event-wait {
            border-left: 4px solid #a0a0a0;
        }

        .event-chat {
            border-left: 4px solid #4ae2a0;
        }

        .event-controls {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: 0.2s;
        }

        .event-item:hover .event-controls {
            opacity: 1;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .btn-icon:hover {
            color: white;
            border-color: white;
        }

        .editor-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sound-library {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body class="dark-theme">
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="rec-dot"></span>
                <h1>REC-OFF-AIR <span>シナリオ・サウンドエディタ</span></h1>
            </div>
            <div class="header-actions">
                <button id="save-json" class="btn-primary">保存 (JSON書き出し)</button>
            </div>
        </header>

        <main>
            <!-- 左: イベントタイムライン -->
            <section class="timeline-container">
                <div class="editor-header">
                    <h2>イベントシーケンス</h2>
                    <div class="toolbar">
                        <button class="btn-icon" title="セリフ追加" onclick="app.addEvent('say')">+セリフ</button>
                        <button class="btn-icon" title="待機追加" onclick="app.addEvent('wait')">+待機</button>
                    </div>
                </div>
                <div id="event-list" class="event-list">
                    <!-- JSONイベントがここに展開される -->
                </div>
            </section>

            <!-- 右: サウンドライブラリ -->
            <section class="sound-library">
                <div class="editor-header">
                    <h2>サウンド・パレット</h2>
                    <div class="search-box">
                        <input type="text" id="sound-search" placeholder="音声を検索...">
                    </div>
                </div>

                <nav id="category-list" class="category-nav">
                    <!-- カテゴリ -->
                </nav>

                <div id="sound-grid" class="sound-grid" style="padding: 20px; overflow-y: auto; height: 300px;">
                    <!-- サウンドカード -->
                </div>

                <div class="property-panel"
                    style="width: 100%; border-left: none; border-top: 1px solid var(--border);">
                    <h3>サウンド調整 & 挿入</h3>
                    <div id="active-sound-info" class="sound-info-empty">音量・ピッチ調整</div>
                    <div class="adjust-panel">
                        <div class="control-row">
                            <label>音量 (dB)</label>
                            <input type="range" id="prop-vol" min="-40" max="10" step="0.5" value="0">
                            <span id="label-vol">0 dB</span>
                        </div>
                    </div>
                    <button id="insert-sound" class="btn-primary" style="margin-top: 10px;">選択中のイベントに挿入</button>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
